<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d5b8" />
      <stop offset="100%" stop-color="#e0ac82" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="200" cy="200" r="190" fill="#0f172a" stroke="url(#avatarBg)" stroke-width="6" filter="url(#glow)"/>
  
  <g transform="translate(0, 10)">
    <!-- Body / Shirt -->
    <path d="M110 360 C110 270, 140 250, 200 250 C260 250, 290 270, 290 360 Z" fill="#1e293b" />
    <!-- Collar & Tie/Suit -->
    <path d="M165 250 L200 300 L235 250 L200 240 Z" fill="#06b6d4" opacity="0.9" />
    <path d="M195 255 L205 255 L208 340 L200 350 L192 340 Z" fill="#8b5cf6" />
    
    <!-- Neck -->
    <rect x="180" y="200" width="40" height="50" rx="8" fill="url(#skin)" />
    
    <!-- Head -->
    <ellipse cx="200" cy="165" rx="55" ry="65" fill="url(#skin)" />
    
    <!-- Hair -->
    <path d="M142 165 C138 120, 160 85, 200 85 C240 85, 262 120, 258 165 C255 140, 240 105, 200 105 C160 105, 145 140, 142 165 Z" fill="#18181b" />
    <!-- Modern styled hair top -->
    <path d="M145 135 C150 90, 190 75, 225 80 C250 85, 260 110, 255 140 C245 110, 220 95, 185 95 C160 95, 150 115, 145 135 Z" fill="#09090b" />
    
    <!-- Beard & Mustache -->
    <path d="M160 185 C170 230, 230 230, 240 185 C235 220, 165 220, 160 185 Z" fill="#18181b" />
    <path d="M178 192 C190 185, 210 185, 222 192 C210 198, 190 198, 178 192 Z" fill="#18181b" />
    
    <!-- Eyes & Brows -->
    <circle cx="178" cy="155" r="4" fill="#09090b" />
    <circle cx="222" cy="155" r="4" fill="#09090b" />
    <path d="M168 145 Q178 140, 188 145" stroke="#18181b" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M212 145 Q222 140, 232 145" stroke="#18181b" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Smile -->
    <path d="M190 202 Q200 208, 210 202" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Floating tech badge icons -->
  <g transform="translate(300, 70)">
    <circle cx="25" cy="25" r="24" fill="#0b1120" stroke="#06b6d4" stroke-width="2" />
    <text x="25" y="32" text-anchor="middle" font-size="20">⚛️</text>
  </g>
  <g transform="translate(45, 270)">
    <circle cx="22" cy="22" r="22" fill="#0b1120" stroke="#10b981" stroke-width="2" />
    <text x="22" y="28" text-anchor="middle" font-size="16">🟢</text>
  </g>
</svg>
